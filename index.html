<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S04 · Inventario de tripulación — Misión Red Planet I</title>
  <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
  <main>
    <h1>Tripulación</h1>
    <p class="subtitulo">Red Planet I · Antes del despegue</p>

    <div class="rejilla">
      <section aria-labelledby="titulo-alta">
        <h2 id="titulo-alta">Añadir integrante</h2>
        <form id="formAstronauta" novalidate>
          <label>Nombre
            <input id="nombre" type="text" autocomplete="off" required>
          </label>
          <label>Rol
            <input id="rol" type="text" autocomplete="off" required>
          </label>
          <label>Años de experiencia
            <input id="experiencia" type="number" min="0" step="1" inputmode="numeric" required>
          </label>
          <button type="submit" class="principal">Agregar</button>
        </form>
        <p id="mensaje" role="status" aria-live="polite"></p>
      </section>

      <section aria-labelledby="titulo-panel">
        <h2 id="titulo-panel">Consultar</h2>
        <div class="acciones">
          <button id="btnListar">Ver todos</button>
          <button id="btnFiltrar">Pilotos</button>
          <button id="btnMedia">Experiencia media</button>
        </div>
        <p id="salida" aria-live="polite"></p>
      </section>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
